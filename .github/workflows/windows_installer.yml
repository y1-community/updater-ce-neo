name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 3.0.3)'
        required: false
        default: '3.0.3'
      publish_release:
        description: 'Publish release asset if tag or release exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup (Inno Setup)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm InnioasisUpdater.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress --yes

      - name: Compile Inno Setup Installer
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = "3.0.3" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$ver" scripts\build_windows_installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpdaterCE-Windows-Installer
          path: dist/UpdaterCE-Setup-*.exe
          if-no-files-found: error

      - name: Attach to Release (Optional)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UpdaterCE-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
