name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 2.5)'
        required: false
        default: '2.5'
      publish_release:
        description: 'Publish release asset if tag or release exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup (Inno Setup)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --distpath dist/windows --workpath build/windows --noconfirm InnioasisUpdater.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress --yes

      - name: Compile Inno Setup Installer
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = "2.5" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$ver" scripts\build_windows_installer.iss

      # Updater CE needs 64-bit Windows 10 1809 or newer. Windows XP/Vista/7/8/8.1
      # and 32-bit PCs can only run SP Flash Tool, so ship that on its own: a
      # folder holding nothing but the flash tool, zipped with donate.txt. The
      # firmware mirrors take this ZIP and repack it beside a rom as
      # <romzipname>-windows-legacy.zip for the site's legacy download button.
      - name: Package Legacy Flash Tool (Windows XP/7/8, 32-bit)
        shell: pwsh
        run: |
          $root = "dist/windows-legacy"
          $tool = Join-Path $root "SP_Flash_Tool"
          $source = "tools/windows/SP_Flash_Tool_v5.1904_Win"
          if (-not (Test-Path $source)) { throw "SP Flash Tool source missing at $source" }
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $tool -Recurse -Force
          Remove-Item -Force (Join-Path $tool "history.ini") -ErrorAction SilentlyContinue
          Remove-Item -Force (Join-Path $tool "flash_tool.log") -ErrorAction SilentlyContinue
          @"
          Innioasis Updater CE and the firmware archive are run by the community, for free.

          If this package saved your player, you can say thanks here:
            https://innioasis.app/donate.html
            https://ko-fi.com/teamslide
            https://github.com/sponsors/y1-community
          "@ | Set-Content -Path (Join-Path $root "donate.txt") -Encoding utf8
          @"
          Innioasis SP Flash Tool - portable package for Windows XP / Vista / 7 / 8 / 8.1 (32-bit and 64-bit)

          This folder contains SP Flash Tool and its MediaTek download agents, nothing else.
          Use it when Updater CE cannot run on your PC (it needs 64-bit Windows 10 1809+).

          Full guide: https://innioasis.app/windows-legacy.html
          "@ | Set-Content -Path (Join-Path $root "README.txt") -Encoding utf8
          Compress-Archive -Path $tool, (Join-Path $root "donate.txt"), (Join-Path $root "README.txt") `
            -DestinationPath (Join-Path $root "Innioasis-SP-Flash-Tool-windows-legacy.zip") -Force
          Write-Host "Legacy flash tool package:"
          Get-ChildItem -Path $root | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpdaterCE-Windows-Installer
          path: dist/windows/UpdaterCE-Setup-*.exe
          if-no-files-found: error

      - name: Upload Legacy Flash Tool Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Innioasis-SP-Flash-Tool-windows-legacy
          path: dist/windows-legacy/Innioasis-SP-Flash-Tool-windows-legacy.zip
          if-no-files-found: error

      - name: Attach to Release (Optional)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/UpdaterCE-Setup-*.exe
            dist/windows-legacy/Innioasis-SP-Flash-Tool-windows-legacy.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
