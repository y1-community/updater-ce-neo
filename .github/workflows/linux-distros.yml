name: Linux Distro Smoke Test

# The Linux reports that mattered most were distribution-specific: Debian and
# Mint missing libxcb-cursor0, older glibc rejecting a bundle frozen on Arch,
# and Qt 6.10 refusing pre-SSE4.2 CPUs. Building on Ubuntu 22.04 is necessary
# but not sufficient, so this job starts the published build on each family we
# promise. A release may publish a tarball, an AppImage, or both; the workflow
# extracts whichever is present (no FUSE in these containers).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
          - image: debian:12
          - image: fedora:40
          - image: opensuse/leap:15.6
          - image: archlinux:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install prerequisites
        run: |
          set -e
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends curl ca-certificates tar python3 \
              libxcb-cursor0 libxcb-image0 libxcb-render-util0 libxcb-util1 \
              libxkbcommon-x11-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 \
              libglib2.0-0 libusb-1.0-0 file binutils
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y curl ca-certificates tar python3 xcb-util-cursor xcb-util-image \
              xcb-util-renderutil xcb-util libxkbcommon-x11 mesa-libGL mesa-libEGL \
              fontconfig dbus-libs glib2 libusb1 file binutils
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive refresh
            zypper --non-interactive install curl ca-certificates tar python3 \
              libxcb-cursor0 xcb-util-image xcb-util-renderutil libxcb-util1 \
              libxkbcommon-x11-0 libGL1 libEGL1 fontconfig libdbus-1-3 glib2 libusb-1_0-0 file binutils
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm --needed curl ca-certificates tar python3 \
              xcb-util-cursor xcb-util-image xcb-util-renderutil xcb-util \
              libxkbcommon-x11 mesa fontconfig dbus glib2 libusb file binutils
          fi
          cat /etc/os-release | head -3

      - name: Host library report
        run: |
          curl -fsSL https://innioasis.app/run_linux.sh -o /tmp/run_linux.sh
          bash /tmp/run_linux.sh --check || echo "check reported missing optional libraries"

      - name: Fetch the newest x86_64 build
        run: |
          set -e
          python3 - <<'PY' > /tmp/asset_url
          import json, urllib.request
          api = "https://api.github.com/repos/y1-community/updater-ce-neo/releases?per_page=20"
          req = urllib.request.Request(api, headers={"User-Agent": "linux-smoke"})
          releases = json.loads(urllib.request.urlopen(req, timeout=60).read())
          wanted = []
          for release in releases:
              for asset in release.get("assets", []):
                  name = asset["name"].lower()
                  if not (name.endswith(".tar.gz") or name.endswith(".appimage")):
                      continue
                  if any(key in name for key in ("x86_64", "x86-64", "amd64")):
                      wanted.append((name.endswith(".tar.gz"), asset["browser_download_url"]))
          if not wanted:
              raise SystemExit("no x86_64 Linux asset in the last 20 releases")
          # Prefer the tarball: it needs no FUSE and no extraction tool.
          wanted.sort(reverse=True)
          print(wanted[0][1])
          PY
          curl -fL --retry 3 -o /tmp/updater.asset "$(cat /tmp/asset_url)"
          mkdir -p /tmp/updater
          case "$(cat /tmp/asset_url)" in
            *.AppImage|*.appimage)
              chmod +x /tmp/updater.asset
              cd /tmp/updater
              /tmp/updater.asset --appimage-extract >/dev/null
              echo "/tmp/updater/squashfs-root/AppRun" > /tmp/launcher_path
              ;;
            *)
              tar -xzf /tmp/updater.asset -C /tmp/updater
              find /tmp/updater -maxdepth 4 -name AppRun -type f -print -quit > /tmp/launcher_path
              if [ ! -s /tmp/launcher_path ]; then
                find /tmp/updater -maxdepth 4 -name InnioasisUpdater -type f -print -quit > /tmp/launcher_path
              fi
              ;;
          esac
          launcher="$(cat /tmp/launcher_path)"
          [ -n "$launcher" ] || { echo "no launcher in the downloaded build"; exit 1; }
          chmod +x "$launcher"
          echo "launcher: $launcher"

      - name: Start the bundle headlessly
        run: |
          set -e
          launcher="$(cat /tmp/launcher_path)"
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 "$launcher" --self-check
          echo "self-check passed on $(. /etc/os-release; echo "$PRETTY_NAME")"

      - name: Terminal interface starts too
        run: |
          set -e
          launcher="$(cat /tmp/launcher_path)"
          "$launcher" --tui --help
          "$launcher" --cli --version

      - name: Lite installer check
        run: |
          curl -fsSL https://innioasis.app/run_linux_lite.sh -o /tmp/run_linux_lite.sh
          sh /tmp/run_linux_lite.sh --check
