name: Build Linux AppImage

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'assets/**'
      - 'vendor/**'
      - 'launcher.py'
      - 'InnioasisUpdater.spec'
      - 'build_appimage.sh'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/appimage.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'vendor/**'
      - 'launcher.py'
      - 'InnioasisUpdater.spec'
      - 'build_appimage.sh'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/appimage.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release draft/asset on manual dispatch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build x86_64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libusb-1.0-0 \
            file \
            desktop-file-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run Smoke Tests (Headless)
        run: |
          QT_QPA_PLATFORM=offscreen python tests/smoke_test.py

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh --clean

      - name: Verify AppImage Execution (Headless)
        run: |
          QT_QPA_PLATFORM=offscreen timeout 5 ./dist/InnioasisUpdater-x86_64.AppImage --appimage-extract-and-run || [ $? -eq 124 ]

      - name: Upload AppImage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InnioasisUpdater-Linux-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
          retention-days: 14

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
