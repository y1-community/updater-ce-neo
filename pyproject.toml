[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "innioasis-updater-neo"
version = "1.1.2"
description = "Cross-platform Innioasis firmware updater: InniUpdaterChin flash engine + online firmware catalog + donations modal"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.5",
    "requests>=2.31",
    "pyusb>=1.2",
    "pycryptodome>=3.19",
    "pycryptodomex>=3.19",
    "pyserial>=3.5",
    "colorama>=0.4",
    "capstone>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
