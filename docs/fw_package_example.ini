# Innioasis Updater CE / MediaTek Installer
# Firmware Package Configuration File Example (fw_package.ini)
#
# When this file (named fw_package.ini) sits in the same directory as a single
# *scatter*.txt file (e.g. in the sp_flash_tool directory on Windows/Linux, or in
# a Firmware folder beside the .app bundle on macOS), the application automatically
# detects the firmware release and primes the installation flow directly into the
# Install Software screen.
#
# Only the scatter, the files it lists, this ini and the updater image need to be
# there; other files in the folder are ignored. A scatter with "preserve" in its
# name is a data-preserving variant of the release, not the package's scatter.
#
# Note: fw_package.ini is OPTIONAL. If omitted, Updater CE automatically detects
# the single scatter file, infers the target model, and initiates the install flow.
#
# If a *rockbox*.txt file is also present in the same folder, Rockbox themes and
# fontpacks will automatically be installed alongside the firmware.
#
# Install-first firmware: when slidia_manifest.xml declares install_first (and
# optional install_first_version), copy those attributes here. A portable pack
# that carries the base firmware puts its scatter and listed images in a
# neighbouring pre_stage folder; this ini names the base repository so the app
# can prove the two folders are a pair. If pre_stage is absent, Updater CE asks
# the usual question and downloads the base after confirmation.

[Firmware]
# Software Name displayed in install prompts and the details header.
# Examples: Rockbox, Innioasis OS, Solar, ATA Android
software_name = Rockbox

# Software version displayed beside the software name.
# Examples: 2.5, 3.2.1, 0.9.0
version = 2.5

# Target device model.
# Supported values: Y1, Y2, or Generic MTK
target_model = Y1

# Target hardware type or variant.
# Supported values: Type A, Type B, Stock, Native, 360p, 240p
target_type = Type A

# Optional description of this firmware release shown in release details.
description = Community Rockbox build with 360p theme and fontpack support for Innioasis Y1.

# Optional toggle: set to false to temporarily disable automated detection.
# Default is true.
enabled = true

# Repository of this firmware (owner/name). Portable install-first packaging
# writes the manifest's repo attribute here on both the target and its base.
repo = someone/reborn

# Repository of the firmware that must be on the player before this one, copied
# from install_first in slidia_manifest.xml. Leave empty for ordinary releases.
install_first = y1-community/y1-stock-rom

# Optional version constraint for that base. A bare version is a minimum;
# =3.2.0 is exact, <= caps, 2.3.0-3.0.0 is an inclusive range.
install_first_version = 3.2.0=>
